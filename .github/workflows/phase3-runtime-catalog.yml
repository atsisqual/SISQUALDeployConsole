name: phase3-runtime-catalog

on:
  pull_request:
    paths:
      - 'runtime/Sisqual.Runtime.Catalog.psm1'
      - 'runtime/Sisqual.Runtime.Catalog.Core.ps1'
      - 'tests/Integration/Test-RuntimeCatalog.ps1'
      - 'tests/Integration/Test-RuntimeCatalog-Sidecars.ps1'
      - '.github/workflows/phase3-runtime-catalog.yml'
      - 'spikes/phase1B/sqlite-provider/ProviderProbe.csproj'
      - 'docs/phase1/evidence/phase1b-sqlite-provider-37392036026/packages.lock.json'
  push:
    branches:
      - main
    paths:
      - 'runtime/Sisqual.Runtime.Catalog.psm1'
      - 'runtime/Sisqual.Runtime.Catalog.Core.ps1'
      - 'tests/Integration/Test-RuntimeCatalog.ps1'
      - 'tests/Integration/Test-RuntimeCatalog-Sidecars.ps1'
      - '.github/workflows/phase3-runtime-catalog.yml'
      - 'spikes/phase1B/sqlite-provider/ProviderProbe.csproj'
      - 'docs/phase1/evidence/phase1b-sqlite-provider-37392036026/packages.lock.json'
  workflow_dispatch:

permissions:
  contents: write   # only to publish the test logs to a temporary results/ branch

concurrency:
  group: phase3-runtime-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-catalog:
    name: runtime catalog on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up exact .NET SDK for CI-only provider materialization
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.100'

      - name: Materialize exact locked provider payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'provider-source'
          $output = Join-Path $env:RUNNER_TEMP 'provider'
          New-Item -ItemType Directory -Path $source, $output -Force | Out-Null
          Copy-Item -LiteralPath '.\spikes\phase1B\sqlite-provider\ProviderProbe.csproj' -Destination (Join-Path $source 'ProviderProbe.csproj')
          Copy-Item -LiteralPath '.\docs\phase1\evidence\phase1b-sqlite-provider-37392036026\packages.lock.json' -Destination (Join-Path $source 'packages.lock.json')
          Push-Location $source
          try {
            dotnet restore .\ProviderProbe.csproj --locked-mode --no-cache --force
            if ($LASTEXITCODE -ne 0) { throw 'Locked provider restore failed.' }
            dotnet build .\ProviderProbe.csproj -c Release -r win-x64 --no-restore -o $output
            if ($LASTEXITCODE -ne 0) { throw 'Provider materialization failed.' }
          }
          finally { Pop-Location }
          "PROVIDER_ROOT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify portable PowerShell 7.6.6 and SQLite CLI 3.53.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pwshZip = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
          $sqliteZip = Join-Path $env:RUNNER_TEMP 'sqlite-tools-win-x64-3530400.zip'
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $pwshZip
          Invoke-WebRequest -Uri 'https://www.sqlite.org/2026/sqlite-tools-win-x64-3530400.zip' -OutFile $sqliteZip
          $expectedPwsh = '02FE458BE20493FBDF43F61EA20610B811EE6C738AB1676C61B9CFCD1A33C860'
          $expectedSqlite = 'F46EE2475DE4CBE287E6E5F7D43C838796B14E7379CD216BDBB28D391429F9FC'
          if ((Get-FileHash -LiteralPath $pwshZip -Algorithm SHA256).Hash -cne $expectedPwsh) { throw 'PowerShell SHA-256 mismatch.' }
          if ((Get-FileHash -LiteralPath $sqliteZip -Algorithm SHA256).Hash -cne $expectedSqlite) { throw 'SQLite CLI SHA-256 mismatch.' }
          $pwshRoot = Join-Path $env:RUNNER_TEMP 'pwsh-7.6.6'
          $sqliteRoot = Join-Path $env:RUNNER_TEMP 'sqlite-3.53.4'
          Expand-Archive -LiteralPath $pwshZip -DestinationPath $pwshRoot -Force
          Expand-Archive -LiteralPath $sqliteZip -DestinationPath $sqliteRoot -Force
          $pwsh = Join-Path $pwshRoot 'pwsh.exe'
          $sqlite = Get-ChildItem -LiteralPath $sqliteRoot -Recurse -File -Filter 'sqlite3.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not (Test-Path -LiteralPath $pwsh -PathType Leaf)) { throw 'Portable pwsh.exe is missing.' }
          if ([string]::IsNullOrWhiteSpace($sqlite)) { throw 'Pinned sqlite3.exe is missing.' }
          $version = & $pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($version.Trim() -cne '7.6.6') { throw "Unexpected PowerShell version: $version" }
          "PORTABLE_PWSH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLITE3_PATH=$sqlite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run runtime catalog integration tests
        shell: pwsh
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE 'runtime-catalog-${{ matrix.os }}.json'
          $sidecarReport = Join-Path $env:GITHUB_WORKSPACE 'runtime-catalog-sidecars-${{ matrix.os }}.json'
          & $env:PORTABLE_PWSH -NoLogo -NoProfile -NonInteractive -File '.\tests\Integration\Test-RuntimeCatalog.ps1' -ProviderRoot $env:PROVIDER_ROOT -SqliteCli $env:SQLITE3_PATH -ReportPath $report *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'rc-1-catalog.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PORTABLE_PWSH -NoLogo -NoProfile -NonInteractive -File '.\tests\Integration\Test-RuntimeCatalog-Sidecars.ps1' -ProviderRoot $env:PROVIDER_ROOT -SqliteCli $env:SQLITE3_PATH -ReportPath $sidecarReport *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'rc-2-sidecars.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload runtime catalog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-runtime-catalog-${{ matrix.os }}
          path: |
            runtime-catalog-${{ matrix.os }}.json
            runtime-catalog-sidecars-${{ matrix.os }}.json
          if-no-files-found: warn

      - name: Publish the logs to a temporary results branch
        # A pull request from a fork or from Dependabot gets a read-only token, so the push would fail and turn the checks red.
        if: ${{ always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        # Diagnostics only: a failure to publish the logs must not turn the real checks red.
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'stage-log'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($f in Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'rc-*.log') {
              $text = [IO.File]::ReadAllText($f.FullName)
              $text = [regex]::Replace($text, '[^\x09\x0A\x20-\x7E]', '?')
              if ($text.Length -gt 200000) { $text = $text.Substring(0, 200000) }
              [IO.File]::WriteAllText((Join-Path $stage $f.Name), ($text -replace "`r`n", "`n"), [Text.UTF8Encoding]::new($false))
          }
          if (-not (Get-ChildItem -LiteralPath $stage -Filter '*.log')) { [IO.File]::WriteAllText((Join-Path $stage 'rc-none.log'), 'no log was produced', [Text.UTF8Encoding]::new($false)) }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $tag = $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + ('${{ matrix.os }}' -replace '[^a-z0-9]', '')
          $branch = 'results/runtime-catalog-' + $tag
          git checkout --orphan $branch
          git rm -rf -q --ignore-unmatch .
          $dest = 'docs/phase1/evidence/runtime-catalog-' + $tag
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path (Join-Path $stage '*.log') -Destination $dest
          git add -A
          git commit -q -m ('results: runtime catalog logs of run ' + $tag)
          git push origin $branch
