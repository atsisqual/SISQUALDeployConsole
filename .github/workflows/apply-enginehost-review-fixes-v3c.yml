name: apply-enginehost-review-fixes-v3c

on:
  push:
    branches:
      - engine-host/adr-0008-runtime
    paths:
      - '.github/workflows/apply-enginehost-review-fixes-v3c.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: engine-host/adr-0008-runtime
          fetch-depth: 0

      - name: Patch all async stdin GetResult calls and apply V3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [Text.UTF8Encoding]::new($false)
          $path = '.github/scripts/Apply-EngineHostReviewFixesV3.ps1'
          $text = [IO.File]::ReadAllText($path)
          $old = '$stdinTask.GetAwaiter().GetResult(); $process.StandardInput.Close()'
          $new = '[void]$stdinTask.GetAwaiter().GetResult(); $process.StandardInput.Close()'
          $count = ([regex]::Matches($text,[regex]::Escape($old))).Count
          if ($count -ne 3) { throw ("Expected three stdin GetResult calls, found {0}." -f $count) }
          $text = $text.Replace($old,$new)
          $cleanup = "Remove-Item '.github/workflows/apply-enginehost-review-fixes-v3.yml' -Force -ErrorAction SilentlyContinue"
          if (-not $text.Contains($cleanup,[StringComparison]::Ordinal)) { throw 'V3 cleanup anchor missing.' }
          $extra = @(
            "Remove-Item '.github/workflows/apply-enginehost-review-fixes-v3b.yml' -Force -ErrorAction SilentlyContinue",
            "Remove-Item '.github/workflows/apply-enginehost-review-fixes-v3c.yml' -Force -ErrorAction SilentlyContinue"
          ) -join "`n"
          $text = $text.Replace($cleanup,$cleanup + "`n" + $extra)
          [IO.File]::WriteAllText($path,$text,$utf8)
          & $path
