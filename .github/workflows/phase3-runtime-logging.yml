name: phase3-runtime-logging

on:
  push:
    branches:
      - main
    paths:
      - 'runtime/Sisqual.Runtime.Logging.psm1'
      - 'tests/Unit/Test-RuntimeLogging.ps1'
      - '.github/workflows/phase3-runtime-logging.yml'
  pull_request:
    paths:
      - 'runtime/Sisqual.Runtime.Logging.psm1'
      - 'tests/Unit/Test-RuntimeLogging.ps1'
      - '.github/workflows/phase3-runtime-logging.yml'
  workflow_dispatch:

concurrency:
  group: phase3-runtime-logging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify portable PowerShell 7.6.6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip'
          $expected = '02FE458BE20493FBDF43F61EA20610B811EE6C738AB1676C61B9CFCD1A33C860'
          $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'pwsh-7.6.6'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -cne $expected) {
            throw "PowerShell archive SHA-256 mismatch. Expected $expected, got $actual."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime -Force
          $pwsh = Join-Path $runtime 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $pwsh -PathType Leaf)) {
            throw "Portable pwsh.exe not found: $pwsh"
          }
          $version = & $pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($version.Trim() -cne '7.6.6') {
            throw "Unexpected portable PowerShell version: $version"
          }
          "PORTABLE_PWSH=$pwsh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run runtime logging unit tests
        shell: pwsh
        run: |
          & $env:PORTABLE_PWSH -NoLogo -NoProfile -File .\tests\Unit\Test-RuntimeLogging.ps1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Re-run retention tests west of UTC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-TimeZone -Id 'SA Eastern Standard Time'
          & $env:PORTABLE_PWSH -NoLogo -NoProfile -File .\tests\Unit\Test-RuntimeLogging.ps1
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
