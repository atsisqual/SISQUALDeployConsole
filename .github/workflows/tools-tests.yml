name: tools-tests

# Runs only when the tools or their tests change. Everything here uses the latest
# PowerShell (pwsh), as decided by the owner on 2026-10-05. The 5.1 parser step of
# ci.yml (PR #10) is separate and stays for files that must run in Windows PowerShell 5.1.

permissions:
  contents: write   # only to publish the integration log to a temporary results/ branch

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'modules/**'
      - 'tests/**'
      - '.github/workflows/tools-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - 'modules/**'
      - 'tests/**'

jobs:
  tools-windows:
    runs-on: windows-2022
    env:
      # Keep LF in the working tree so the ASCII/LF check sees what is committed.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Parse tools and tests with the PowerShell 7 parser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $files = @(Get-ChildItem -LiteralPath tools, tests, modules -Recurse -File -Include '*.ps1', '*.psm1' -ErrorAction SilentlyContinue)
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
              if (@($errors).Count -gt 0) {
                  $failed = $true
                  foreach ($e in @($errors)) { Write-Host ('{0} line {1}: {2}' -f $file.FullName, $e.Extent.StartLineNumber, $e.Message) }
              }
              else { Write-Host ('PASS parser: {0}' -f $file.FullName) }
          }
          if ($failed) { throw 'PowerShell 7 parse failure.' }

      - name: ASCII and LF in tools, tests and modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          $files = @(Get-ChildItem -LiteralPath tools, tests, modules -Recurse -File -ErrorAction SilentlyContinue)
          foreach ($file in $files) {
              $bytes = [IO.File]::ReadAllBytes($file.FullName)
              $bad = @($bytes | Where-Object { $_ -gt 127 -or $_ -eq 13 })
              if ($bad.Count -gt 0) { $failed = $true; Write-Host ('Non-ASCII or CR bytes in {0}' -f $file.FullName) }
          }
          if ($failed) { throw 'ASCII/LF policy failed.' }
          Write-Host 'PASS ASCII/LF'

      - name: Pinned sqlite3 (3.53.4), SHA-256 verified
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same artifact and hash as vendor/manifest.json (PR #10) and spikes/phase1A/Test-Phase1A.ps1.
          $url = 'https://www.sqlite.org/2026/sqlite-tools-win-x64-3530400.zip'
          $expected = 'F46EE2475DE4CBE287E6E5F7D43C838796B14E7379CD216BDBB28D391429F9FC'
          $zip = Join-Path $env:RUNNER_TEMP 'sqlite-tools.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw ('sqlite tools SHA-256 mismatch: {0}' -f $actual) }
          $dir = Join-Path $env:RUNNER_TEMP 'sqlite-tools'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -LiteralPath $dir -Recurse -Filter 'sqlite3.exe' | Select-Object -First 1
          if (-not $exe) { throw 'sqlite3.exe was not found in the archive.' }
          & $exe.FullName --version
          ('SQLITE3_PATH=' + $exe.FullName) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # All test files run even if one fails; the output is kept in unit.log so that the
          # publish step can put it on the temporary results branch (job logs are not readable
          # from the agent sandbox).
          $log = Join-Path $env:RUNNER_TEMP 'unit.log'
          '' | Set-Content -LiteralPath $log -Encoding ascii
          $tests = @(Get-ChildItem -LiteralPath tests/Unit -Recurse -File -Filter 'Test-*.ps1')
          $failed = @()
          foreach ($test in $tests) {
              ('=== {0}' -f $test.Name) | Tee-Object -FilePath $log -Append
              pwsh -NoProfile -File $test.FullName *>&1 | Tee-Object -FilePath $log -Append
              if ($LASTEXITCODE -ne 0) { $failed += $test.Name }
          }
          if ($failed.Count -gt 0) { throw ('Test failed: {0}' -f ($failed -join ', ')) }

      - name: Restore the pinned SQL client (every file verified against vendor/sqlclient-pin.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/Initialize-SqlClient.ps1 -OutputFolder (Join-Path $env:RUNNER_TEMP 'sqlclient')

      - name: Integration test of the SQL Server path on LocalDB
        id: integration
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'integration.log'
          pwsh -NoProfile -File tests/Integration/Test-SqlServerPath.ps1 -SqlClientPath (Join-Path $env:RUNNER_TEMP 'sqlclient') -Sqlite3Path $env:SQLITE3_PATH *>&1 | Tee-Object -FilePath $log
          exit $LASTEXITCODE

      - name: Publish the logs to a temporary results branch
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-CleanLog {
              param([string]$Path, [string]$Missing)
              if (-not (Test-Path -LiteralPath $Path)) { return $Missing }
              $text = [IO.File]::ReadAllText($Path)
              $text = [regex]::Replace($text, '[^\x09\x0A\x20-\x7E]', '?')
              if ($text.Length -gt 200000) { $text = $text.Substring(0, 200000) }
              return ($text -replace "`r`n", "`n")
          }
          $stage = Join-Path $env:RUNNER_TEMP 'stage-log'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $stage 'integration.log'), (Get-CleanLog (Join-Path $env:RUNNER_TEMP 'integration.log') 'no log was produced'), $utf8)
          [IO.File]::WriteAllText((Join-Path $stage 'unit.log'), (Get-CleanLog (Join-Path $env:RUNNER_TEMP 'unit.log') 'no unit log was produced'), $utf8)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $branch = 'results/integration-' + $env:GITHUB_RUN_ID
          git checkout --orphan $branch
          git rm -rf -q --ignore-unmatch .
          $dest = 'docs/phase1/evidence/integration-' + $env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $stage 'integration.log') -Destination (Join-Path $dest 'integration.log')
          Copy-Item -LiteralPath (Join-Path $stage 'unit.log') -Destination (Join-Path $dest 'unit.log')
          git add -A
          git commit -q -m ('results: logs of run ' + $env:GITHUB_RUN_ID)
          git push origin $branch
