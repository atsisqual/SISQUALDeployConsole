name: phase1b-sqlite-provider

on:
  push:
    branches: ['spike/phase1b-sqlite-managed-provider']
    paths:
      - 'spikes/phase1B/sqlite-provider/**'
      - '.github/workflows/phase1b-sqlite-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-provider:
    name: SQLite managed provider on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10 for spike preparation only
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and materialize the proposed provider payload
        shell: pwsh
        working-directory: spikes/phase1B/sqlite-provider
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore .\ProviderProbe.csproj --use-lock-file
          dotnet build .\ProviderProbe.csproj -c Release -r win-x64 --no-restore -o "$env:RUNNER_TEMP\provider"
          if ($LASTEXITCODE -ne 0) { throw 'Provider build failed.' }
          Get-ChildItem "$env:RUNNER_TEMP\provider" -Recurse -File |
            Select-Object Name, Length, FullName |
            Sort-Object Name |
            Format-Table | Out-String | Write-Host

      - name: Download and verify pinned portable runtime and SQLite CLI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $pwshZip = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.6-win-x64.zip'
          $sqliteZip = Join-Path $env:RUNNER_TEMP 'sqlite-tools-win-x64-3530400.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $pwshZip
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.sqlite.org/2026/sqlite-tools-win-x64-3530400.zip' -OutFile $sqliteZip

          $expectedPwsh = '02FE458BE20493FBDF43F61EA20610B811EE6C738AB1676C61B9CFCD1A33C860'
          $expectedSqlite = 'F46EE2475DE4CBE287E6E5F7D43C838796B14E7379CD216BDBB28D391429F9FC'
          $actualPwsh = (Get-FileHash $pwshZip -Algorithm SHA256).Hash
          $actualSqlite = (Get-FileHash $sqliteZip -Algorithm SHA256).Hash
          if ($actualPwsh -ne $expectedPwsh) { throw "PowerShell SHA-256 mismatch: $actualPwsh" }
          if ($actualSqlite -ne $expectedSqlite) { throw "SQLite SHA-256 mismatch: $actualSqlite" }

          Expand-Archive $pwshZip -DestinationPath "$env:RUNNER_TEMP\pwsh" -Force
          Expand-Archive $sqliteZip -DestinationPath "$env:RUNNER_TEMP\sqlite" -Force

      - name: Run from the materialized provider folder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pwsh = Join-Path $env:RUNNER_TEMP 'pwsh\pwsh.exe'
          $sqlite = Get-ChildItem "$env:RUNNER_TEMP\sqlite" -Recurse -Filter sqlite3.exe -File | Select-Object -First 1 -ExpandProperty FullName
          & $pwsh -NoLogo -NoProfile -NonInteractive -File '.\spikes\phase1B\sqlite-provider\Test-SqliteManagedProvider.ps1' `
            -ProviderRoot "$env:RUNNER_TEMP\provider" `
            -SqliteCli $sqlite `
            -ReportPath "$env:GITHUB_WORKSPACE\report-${{ matrix.os }}-original.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy the provider folder and run again
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item "$env:RUNNER_TEMP\provider" "$env:RUNNER_TEMP\provider-copy" -Recurse
          $pwsh = Join-Path $env:RUNNER_TEMP 'pwsh\pwsh.exe'
          $sqlite = Get-ChildItem "$env:RUNNER_TEMP\sqlite" -Recurse -Filter sqlite3.exe -File | Select-Object -First 1 -ExpandProperty FullName
          & $pwsh -NoLogo -NoProfile -NonInteractive -File '.\spikes\phase1B\sqlite-provider\Test-SqliteManagedProvider.ps1' `
            -ProviderRoot "$env:RUNNER_TEMP\provider-copy" `
            -SqliteCli $sqlite `
            -ReportPath "$env:GITHUB_WORKSPACE\report-${{ matrix.os }}-copy.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record exact NuGet graph and package hashes
        if: always()
        shell: pwsh
        working-directory: spikes/phase1B/sqlite-provider
        run: |
          $ErrorActionPreference = 'Stop'
          $lockPath = '.\packages.lock.json'
          if (-not (Test-Path -LiteralPath $lockPath -PathType Leaf)) {
            throw 'packages.lock.json was not produced; dependency evidence is incomplete.'
          }

          Copy-Item -LiteralPath $lockPath "$env:GITHUB_WORKSPACE\packages.lock-${{ matrix.os }}.json"
          $lock = Get-Content -LiteralPath $lockPath -Raw | ConvertFrom-Json
          $resolved = @{}

          foreach ($target in $lock.dependencies.PSObject.Properties) {
            foreach ($package in $target.Value.PSObject.Properties) {
              $version = [string]$package.Value.resolved
              if ([string]::IsNullOrWhiteSpace($version)) { continue }
              $id = [string]$package.Name
              $key = $id.ToLowerInvariant() + '|' + $version.ToLowerInvariant()
              if (-not $resolved.ContainsKey($key)) {
                $resolved[$key] = [pscustomobject]@{
                  id = $id
                  version = $version
                  contentHash = [string]$package.Value.contentHash
                }
              }
            }
          }

          if ($resolved.Count -eq 0) {
            throw 'No resolved NuGet packages were found in packages.lock.json.'
          }

          # Validate the lock file with NuGet itself, using an empty package cache so
          # this is a real repeatable restore rather than a comparison of unlike hash formats.
          $isolatedPackages = Join-Path $env:RUNNER_TEMP 'phase1b-locked-packages'
          if (Test-Path -LiteralPath $isolatedPackages) {
            Remove-Item -LiteralPath $isolatedPackages -Recurse -Force
          }
          New-Item -ItemType Directory -Path $isolatedPackages -Force | Out-Null
          $previousNugetPackages = $env:NUGET_PACKAGES
          try {
            $env:NUGET_PACKAGES = $isolatedPackages
            dotnet restore .\ProviderProbe.csproj --locked-mode --no-cache --force
            if ($LASTEXITCODE -ne 0) {
              throw 'NuGet locked-mode restore failed against packages.lock.json.'
            }
          }
          finally {
            $env:NUGET_PACKAGES = $previousNugetPackages
          }

          $downloadRoot = Join-Path $env:RUNNER_TEMP 'phase1b-nupkgs'
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          $rows = @()

          foreach ($item in ($resolved.Values | Sort-Object id, version)) {
            if ([string]::IsNullOrWhiteSpace($item.contentHash)) {
              throw "Lock-file contentHash is missing for $($item.id) $($item.version)."
            }

            $idLower = $item.id.ToLowerInvariant()
            $versionLower = $item.version.ToLowerInvariant()
            $fileName = "$idLower.$versionLower.nupkg"
            $uri = "https://api.nuget.org/v3-flatcontainer/$idLower/$versionLower/$fileName"
            $archive = Join-Path $downloadRoot $fileName

            Invoke-WebRequest -Uri $uri -OutFile $archive
            if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or (Get-Item -LiteralPath $archive).Length -le 0) {
              throw "NuGet archive was not retained for $($item.id) $($item.version)."
            }

            $sha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
            $sha512Hex = (Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash
            $sha512Bytes = [byte[]]::new($sha512Hex.Length / 2)
            for ($i = 0; $i -lt $sha512Bytes.Length; $i++) {
              $sha512Bytes[$i] = [Convert]::ToByte($sha512Hex.Substring($i * 2, 2), 16)
            }
            $rawSha512Base64 = [Convert]::ToBase64String($sha512Bytes)

            if ([string]::IsNullOrWhiteSpace($sha256) -or [string]::IsNullOrWhiteSpace($rawSha512Base64)) {
              throw "Archive hashes were not calculated for $($item.id) $($item.version)."
            }

            $rows += [pscustomobject]@{
              package = $item.id
              version = $item.version
              source = $uri
              bytes = (Get-Item -LiteralPath $archive).Length
              nupkgSha256 = $sha256
              rawNupkgSha512Base64 = $rawSha512Base64
              lockContentHash = $item.contentHash
              lockedRestoreVerified = $true
            }
          }

          $rows | ConvertTo-Json -Depth 4 | Set-Content "$env:GITHUB_WORKSPACE\nuget-graph-${{ matrix.os }}.json" -Encoding utf8NoBOM

      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          $lines = @('### Phase 1B SQLite managed provider - ${{ matrix.os }}', '')
          foreach ($kind in @('original','copy')) {
            $path = Join-Path $env:GITHUB_WORKSPACE "report-${{ matrix.os }}-$kind.json"
            if (-not (Test-Path $path)) {
              $lines += "- ${kind}: **NO REPORT**"
              continue
            }
            $r = Get-Content $path -Raw | ConvertFrom-Json
            $lines += "- ${kind}: **$($r.overall)**; provider $($r.candidateVersion); PowerShell $($r.powerShell)"
            foreach ($c in $r.checks) {
              $lines += "  - $($c.id): $($c.status)"
            }
          }
          $lines | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1b-sqlite-provider-${{ matrix.os }}
          path: |
            report-${{ matrix.os }}-original.json
            report-${{ matrix.os }}-copy.json
            packages.lock-${{ matrix.os }}.json
            nuget-graph-${{ matrix.os }}.json
          if-no-files-found: warn
